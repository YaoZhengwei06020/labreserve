name: Verify baseline and PostgreSQL spike
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.12', '3.13']
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: labreserve
          POSTGRES_USER: labreserve
          POSTGRES_PASSWORD: ci-only-ephemeral
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U labreserve -d labreserve"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      POSTGRES_PASSWORD: ci-only-ephemeral
      POSTGRES_HOST: 127.0.0.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/check_baseline.py
      - run: python scripts/check_project_process.py
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: pytest --junitxml=verification-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ matrix.python }}
          path: verification-results.xml
