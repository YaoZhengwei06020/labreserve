services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-labreserve}
      POSTGRES_USER: ${POSTGRES_USER:-labreserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
  app:
    build: .
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-local-spike-only-not-for-deployment}
      DJANGO_DEBUG: "1"
      POSTGRES_DB: ${POSTGRES_DB:-labreserve}
      POSTGRES_USER: ${POSTGRES_USER:-labreserve}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-only-change-me}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  pgdata:
